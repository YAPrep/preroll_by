<svg
  xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <!-- Эффект рваных краев по периметру -->
    <filter id="grunge-edges">
      <feTurbulence type="fractalNoise" baseFrequency="0.45" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- Сложный градиент из трех цветов с разных углов -->
    <linearGradient id="base-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <!-- Основная подложка: от неонового розового к яркому оранжевому -->
      <stop offset="0%" stop-color="#ff007f" />   <!-- Розовый в левом нижнем углу -->
      <stop offset="100%" stop-color="#ff7700" /> <!-- Оранжевый в правом верхнем углу -->
    </linearGradient>

    <!-- Дополнительная радиальная подсветка для синего угла -->
    <radialGradient id="blue-corner" cx="20%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#0055ff" stop-opacity="1" /> <!-- Синий в левом верхнем углу -->
      <stop offset="100%" stop-color="#0055ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Группа элементов с рваными краями -->
  <g filter="url(#grunge-edges)">
    <!-- 1. Базовый слой: Розово-Оранжевый треугольник -->
    <path 
      d="M9.3 5.4l14.8 9c1.2.7 1.2 2.5 0 3.2l-14.8 9c-1.3.8-3-.1-3-1.6V7c0-1.5 1.7-2.4 3-1.6z" 
      fill="url(#base-gradient)" 
    />
    <!-- 2. Слой наложения: Синее свечение сверху, которое мягко вливается в общую палитру -->
    <path 
      d="M9.3 5.4l14.8 9c1.2.7 1.2 2.5 0 3.2l-14.8 9c-1.3.8-3-.1-3-1.6V7c0-1.5 1.7-2.4 3-1.6z" 
      fill="url(#blue-corner)" 
      style="mix-blend-mode: screen;"
    />
  </g>
</svg>