<svg
  xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <!-- Эффект разрушенной структуры асфальта -->
    <filter id="heavy-destruction">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="5" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- Маска паутины расходящихся трещин -->
    <mask id="cracking-web">
      <!-- Белый фон — целая часть асфальта -->
      <rect width="32" height="32" fill="#ffffff" />
      
      <!-- Точка удара находится примерно на (7, 13) -->
      <!-- Главный горизонтальный раскол (идет сквозь весь плеер) -->
      <polyline points="6.5,13 12,14 19,13.5 25,16" stroke="#000000" stroke-width="0.8" stroke-linecap="round" fill="none" />
      
      <!-- Расходящийся луч 1: уходит вверх к вершине -->
      <polyline points="7,13 9,9 12,6.5" stroke="#000000" stroke-width="0.5" stroke-linecap="round" fill="none" />
      
      <!-- Расходящийся луч 2: уходит по диагонали вниз -->
      <polyline points="7,13 11,18 15,22.5" stroke="#000000" stroke-width="0.6" stroke-linecap="round" fill="none" />
      
      <!-- Небольшое ответвление от центрального скола -->
      <polyline points="12,14 14,11 17,10" stroke="#000000" stroke-width="0.4" stroke-linecap="round" fill="none" />
    </mask>
  </defs>

  <!-- Расколотый плеер в цвете мокрого асфальта -->
  <path 
    d="M9.3 5.4l14.8 9c1.2.7 1.2 2.5 0 3.2l-14.8 9c-1.3.8-3-.1-3-1.6V7c0-1.5 1.7-2.4 3-1.6z" 
    fill="#343b44" 
    filter="url(#heavy-destruction)"
    mask="url(#cracking-web)"
  />
</svg>